[project]
name = "lusora-worker"
version = "0.1.0"
description = "lusora worker: the deterministic stage pipeline"
requires-python = ">=3.12"
dependencies = [
    "lusora-contracts",
    "psycopg[binary]>=3.2",
    "jsonschema>=4.23",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "faster-whisper>=1.2.1",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv.sources]
lusora-contracts = { path = "../contracts/py", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lusora_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
