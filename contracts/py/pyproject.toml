[project]
name = "lusora-contracts"
version = "0.1.0"
description = "lusora contracts: JSON Schemas, catalog, prices, status rules (Python side)"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lusora_contracts"]
