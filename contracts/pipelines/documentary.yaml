name: documentary
version: "1.4"
description: >
  Dark Palace's production on LUSORA's architecture (D100,
  docs/05-roadmap/documentary-pipeline-plan.md). Every DP feature enters as a
  STAGE when it decides content, as a KNOB (style pack, theme, channel config)
  when it chooses a look, sound or pace, and as a PROVIDER when it reaches a
  service — never as a constant.

  v1.0 (slice 0) is faceless_v3's stage list verbatim, so the first Centralia
  render on it is provably the v3 baseline.

  v1.1 (slice 2, D102) adds `subjects` between cut_beats and plan_beats: the
  whole narration read once for its main idea, visual thread and subjects.
  Beat craft then names a subject per beat, and resolve_assets rotates each
  shot through its beat's and its subject's searches.

  v1.2 (slice 3, D103) adds `pick_shots` between compile_plan and
  resolve_assets: several candidates per shot on numbered contact sheets,
  rated by a vision judge against the beat and the main idea; resolve_assets
  fetches the best-rated one and crops a reported logo and any letterbox. Off
  unless the channel sets source_policy.visual.pick.enabled.

  v1.3 (slice 4, D104) adds `gather_footage` before pick_shots: per subject,
  YouTube videos chosen from their titles, downloaded whole through the proxy
  and cut into shots, plus free-licence Commons and archive.org photos, into
  the video's folder. The chain sources `youtube` and `archive` offer that
  pool; finalize writes credits.txt and hands the used YouTube footage to the
  b-roll library. Off unless source_policy.visual.footage.enabled.

  v1.4 (D105) adds `footage_check` after subjects: a metadata-only probe per
  subject that STOPS a topic the internet cannot illustrate before it is
  planned and rendered. pick_shots stops the video too when fewer shots than
  pick.min_coverage have a good candidate, and in review mode it always
  stops. Both write footage_report.md; approving the stage continues.

  Each later slice adds one stage or knob and bumps the version; the stages it adds are registry entries, so v3
  can adopt any of them by listing it (D60).

  stability: test and bulk_production_accepted: false — pinned by name
  (`pipeline: documentary`), never chosen by production_style, until it is
  watched against v3 and promoted (D84).
category: faceless
stability: test

# auto = run straight through, no human gates. The per-stage
# human_approval_on_review_mode flags below take effect only when a video is
# enqueued with the "guided" checkpoint policy — REVIEW mode in the UI (D62).
# A video's own cfg.checkpoint_policy overrides this default, which is what
# lets one channel run the same manifest both ways.
default_checkpoint_policy: auto
bulk_production_accepted: false

orchestration:
  mode: mainly_code
  budget_default_usd: 2.00
  max_revisions_per_stage: 3
  max_send_backs: 3

compatible_themes:
  recommended:
    - standard
    - paper-print
  also_works:
    - field-manual
    - bold-editorial
  custom_allowed: true

# NOTE: bootstrap (claim + materialize cfg.json) runs before this list and is
# NOT a stage — it is the precondition for the loop, not a step it can skip.
# Done-checks (artifact-presence vs. freshness) live in the worker step
# registry, keyed by these names — deliberately not encoded here.
stages:
  - name: script
    produces: [script.txt]
    receivable_on_upload: true            # bring your own narration text
    human_approval_on_review_mode: true   # gate after the script in review mode

  - name: narration
    requires: [script.txt]
    produces: [audio.mp3]
    receivable_on_upload: true            # bring your own voiceover

  - name: transcript
    requires: [audio.mp3]
    produces: [subtitles.srt]
    receivable_on_upload: true            # bring your own subtitles

  # D88 — code cuts the script, with the real transcript timings, before the
  # model is asked anything. plan_beats below then answers by INDEX and never
  # retypes the narration, so verbatim coverage is true by construction.
  - name: cut_beats
    requires: [script.txt, subtitles.srt]
    produces: [beat_cuts.json]
    receivable_on_upload: true            # hand-cut spans (schema-checked)

  # D102 — the whole narration read once, before any shot is planned: what
  # the video is about on screen, and the subjects every beat will name.
  - name: subjects
    requires: [beat_cuts.json]
    produces: [subjects.json]
    receivable_on_upload: true            # hand-written subjects (schema-checked)

  # D105 — is there footage of this story online? A thin topic asks for a
  # human here (a requested gate), before planning and rendering.
  - name: footage_check
    requires: [subjects.json]
    produces: [footage_check.json]

  - name: plan_beats
    requires: [script.txt, subtitles.srt, beat_cuts.json, subjects.json]
    produces: [beats.json]
    receivable_on_upload: true            # hand-written beat sheet (schema-checked)
    human_approval_on_review_mode: true   # gate after the beat sheet in review mode
    # Everything below runs only once this gate is passed, which is what makes
    # "nothing renders before the beats are approved" true rather than a habit.

  # D87 — the overlay question in a call where it is the only question. The
  # planner above therefore composes with NO component menu on this pipeline,
  # and the compiler below prefers overlays.json over the beats' own overlay.
  - name: select_overlays
    requires: [beats.json]
    produces: [overlays.json]
    receivable_on_upload: true            # hand-written selection (schema-checked)

  - name: compile_plan
    requires: [beats.json]
    produces: [edit_plan.json]
    receivable_on_upload: true            # hand-written edit plan (schema-checked)

  # D104 — the open internet, per subject: YouTube shots and archive photos.
  - name: gather_footage
    requires: [subjects.json, beats.json]
    produces: [footage.json]
    receivable_on_upload: false           # the pool points at files only this stage downloads

  # D103 — look before downloading: candidates rated on contact sheets.
  - name: pick_shots
    requires: [edit_plan.json, beats.json]
    produces: [shot_picks.json]
    receivable_on_upload: true            # hand-written picks (schema-checked)
    human_approval_on_review_mode: true   # D105: review the footage before any render

  - name: resolve_assets
    requires: [edit_plan.json]
    produces: [clips/]

  - name: resolve_audio
    requires: [edit_plan.json]
    produces: [audio/]

  - name: validate
    # judges the compiled plan; produces no artifact, so it always runs
    requires: [edit_plan.json]

  - name: render
    requires: [edit_plan.json]
    produces: [final.mp4]

  - name: qa
    # judges the rendered FILE (black/silent/duration); produces no artifact,
    # so it always runs — the gate that keeps a broken render off the review queue
    requires: [final.mp4]

  - name: finalize
    requires: [final.mp4]
    produces: [thumb.jpg, metadata.txt]
