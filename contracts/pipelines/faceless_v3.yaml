name: faceless_v3
version: "1.2"
description: >
  The overlay-quality pipeline. v1.0 was faceless v1's stage list copied
  verbatim, so that the first baseline was taken on a manifest provably
  identical to production.

  v1.2 adds `cut_beats` (D88): the deterministic cutting the fallback planner
  already did becomes its own stage writing beat_cuts.json, and plan_beats then
  answers by INDEX rather than retyping the narration. Verbatim coverage stops
  being a rule the model is checked against and becomes a property of how the
  spans were made.

  v1.1 adds `select_overlays` (D87): the overlay decision moves out of
  plan_beats into a call where it is the only question, reading beats.json and
  writing overlays.json. Two consequences are declared rather than implied —
  the planner composes with NO component menu on any pipeline carrying this
  stage, and the compiler prefers overlays.json when it is present. Neither
  reaches a pipeline that does not list the stage.

  It is NOT built on faceless_v2. v2 is the only home of the `research`
  stage, and putting the overlay work there would move two independent
  variables at once — the eval could then never say which one moved the
  numbers. Manifests are cheap; that is the point of D60 (D84).

  Ships as `stability: test`: promotion is a separate, deliberate act with
  criteria written into D84, and it is two lines — stability: production
  here, and removing faceless.yaml so this wins `production_style: faceless`
  on name order.
category: faceless
stability: test

# auto = run straight through, no human gates. The per-stage
# human_approval_on_review_mode flags below take effect only when a video is
# enqueued with the "guided" checkpoint policy — REVIEW mode in the UI (D62).
# A video's own cfg.checkpoint_policy overrides this default, which is what
# lets one channel run the same manifest both ways.
default_checkpoint_policy: auto
bulk_production_accepted: false

orchestration:
  mode: mainly_code
  budget_default_usd: 2.00
  max_revisions_per_stage: 3
  max_send_backs: 3

compatible_themes:
  recommended:
    - standard
    - paper-print
  also_works:
    - field-manual
    - bold-editorial
  custom_allowed: true

# NOTE: bootstrap (claim + materialize cfg.json) runs before this list and is
# NOT a stage — it is the precondition for the loop, not a step it can skip.
# Done-checks (artifact-presence vs. freshness) live in the worker step
# registry, keyed by these names — deliberately not encoded here.
stages:
  - name: script
    produces: [script.txt]
    receivable_on_upload: true            # bring your own narration text
    human_approval_on_review_mode: true   # gate after the script in review mode

  - name: narration
    requires: [script.txt]
    produces: [audio.mp3]
    receivable_on_upload: true            # bring your own voiceover

  - name: transcript
    requires: [audio.mp3]
    produces: [subtitles.srt]
    receivable_on_upload: true            # bring your own subtitles

  # D88 — code cuts the script, with the real transcript timings, before the
  # model is asked anything. plan_beats below then answers by INDEX and never
  # retypes the narration, so verbatim coverage is true by construction.
  - name: cut_beats
    requires: [script.txt, subtitles.srt]
    produces: [beat_cuts.json]
    receivable_on_upload: true            # hand-cut spans (schema-checked)

  - name: plan_beats
    requires: [script.txt, subtitles.srt, beat_cuts.json]
    produces: [beats.json]
    receivable_on_upload: true            # hand-written beat sheet (schema-checked)
    human_approval_on_review_mode: true   # gate after the beat sheet in review mode
    # Everything below runs only once this gate is passed, which is what makes
    # "nothing renders before the beats are approved" true rather than a habit.

  # D87 — the overlay question in a call where it is the only question. The
  # planner above therefore composes with NO component menu on this pipeline,
  # and the compiler below prefers overlays.json over the beats' own overlay.
  - name: select_overlays
    requires: [beats.json]
    produces: [overlays.json]
    receivable_on_upload: true            # hand-written selection (schema-checked)

  - name: compile_plan
    requires: [beats.json]
    produces: [edit_plan.json]
    receivable_on_upload: true            # hand-written edit plan (schema-checked)

  - name: resolve_assets
    requires: [edit_plan.json]
    produces: [clips/]

  - name: resolve_audio
    requires: [edit_plan.json]
    produces: [audio/]

  - name: validate
    # judges the compiled plan; produces no artifact, so it always runs
    requires: [edit_plan.json]

  - name: render
    requires: [edit_plan.json]
    produces: [final.mp4]

  - name: qa
    # judges the rendered FILE (black/silent/duration); produces no artifact,
    # so it always runs — the gate that keeps a broken render off the review queue
    requires: [final.mp4]

  - name: finalize
    requires: [final.mp4]
    produces: [thumb.jpg, metadata.txt]
