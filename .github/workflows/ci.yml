name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts-and-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # library/broll-engine is a submodule (D71). The TS job does not
          # build it, but lint-boundaries walks the tree and a half-present
          # submodule directory is confusing to debug; the Py job needs it
          # only if a test ever reaches into it.
          submodules: recursive
          # It lives in a SEPARATE private repo (automation-broll-engine), and
          # GITHUB_TOKEN is scoped to this one — it cannot read a second repo,
          # so recursive checkout fails on the child with "Repository not
          # found". Fine-grained PAT, Contents: read-only on both repos; it
          # replaces the credential for the parent checkout too, hence both.
          token: ${{ secrets.LIBRARY_SUBMODULE_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install ffmpeg
        # engine fixture builder + ffmpeg renderer contract test + ffprobe assertions
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Schema validation
        run: pnpm run validate:schemas
      - name: Boundary lint
        run: pnpm run lint:boundaries
      - name: Typecheck
        run: pnpm run typecheck
      - name: TS tests
        # The Remotion end-to-end render uses the runner's preinstalled Chrome
        # (files-only, no browser download); it self-skips if none is present.
        env:
          REMOTION_BROWSER_EXECUTABLE: /usr/bin/google-chrome
        run: pnpm run test
      - name: Catalog drift check
        run: pnpm --filter @lusora/engine run catalog:check

  worker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lusora
          POSTGRES_PASSWORD: lusora
          POSTGRES_DB: lusora_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lusora"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # library/broll-engine is a submodule (D71). The TS job does not
          # build it, but lint-boundaries walks the tree and a half-present
          # submodule directory is confusing to debug; the Py job needs it
          # only if a test ever reaches into it.
          submodules: recursive
          # It lives in a SEPARATE private repo (automation-broll-engine), and
          # GITHUB_TOKEN is scoped to this one — it cannot read a second repo,
          # so recursive checkout fails on the child with "Repository not
          # found". Fine-grained PAT, Contents: read-only on both repos; it
          # replaces the credential for the parent checkout too, hence both.
          token: ${{ secrets.LIBRARY_SUBMODULE_TOKEN }}
      - uses: astral-sh/setup-uv@v5
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Py tests
        working-directory: worker
        env:
          TEST_DATABASE_URL: postgres://lusora:lusora@localhost:5432/lusora_test
        run: uv run pytest -q
